services:
  - type: web
    name: sweetgonz-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --ignore-scripts
    # Render Free does not provide the paid-only preDeployCommand lifecycle.
    # The migration runner is idempotent and executes before the API on boot.
    startCommand: npm run db:migrate && node apps/server/src/index.js
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PROVIDER
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: PGSSL
        value: true
      - key: DATABASE_POOL_MAX
        value: 5
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: 8000
      - key: SESSION_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: true
      - key: TRUST_PROXY
        value: true
      - key: SERVE_WEB
        value: false
      - key: DEPLOYMENT_ID
        value: cloud-fallback
      - key: PUBLIC_ORIGINS
        value: https://sweetgonz.vercel.app
      - key: LOG_LEVEL
        value: info
